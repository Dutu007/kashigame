<!-- 开发入口：自动加载土陶主体位置调整工具（tools/place-tuner.js）。
     触发条件：地址带 ?tools=1，或在 F2 面板里点过该按钮（记在 localStorage.twc_tools）。
     带 ?tools=0 可强制关掉并清除记忆。它只做覆盖层预览，不改动游戏状态；发布前删掉这段即可。 -->
<script>
(function () {
  var q = location.search;
  var on = q.indexOf('tools=1') >= 0;
  if (q.indexOf('tools=0') >= 0) {
    try { localStorage.removeItem('twc_tools'); } catch (e) {}
  } else if (!on) {
    try { on = localStorage.getItem('twc_tools') === '1'; } catch (e) {}
  } else {
    try { localStorage.setItem('twc_tools', '1'); } catch (e) {}
  }
  if (!on) return;
  var s = document.createElement('script');
  s.src = 'tools/place-tuner.js?v=' + Date.now();
  document.body.appendChild(s);
})();
</script>
</body>
</html>
