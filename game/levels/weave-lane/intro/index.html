<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>喀什小镇 · 织梦巷转场 · 丝滑优化版</title>
<link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <main id="stage" aria-label="织梦巷章节转场">
    <img class="background" src="assets/bg_zhimengxiang.png" alt="织梦巷转场背景" draggable="false" />
    <div class="fabric-mist" aria-hidden="true"></div>
    <div class="fabric-texture" aria-hidden="true"></div>
    <div class="particles" aria-hidden="true">
      <i style="--x:7%;--y:31%;--s:2px;--d:8.2s;--delay:-2.1s"></i>
      <i style="--x:12%;--y:67%;--s:2px;--d:9.0s;--delay:-6.4s"></i>
      <i style="--x:18%;--y:49%;--s:1.5px;--d:7.4s;--delay:-3.8s"></i>
      <i style="--x:24%;--y:72%;--s:2.5px;--d:10.2s;--delay:-7.0s"></i>
      <i style="--x:31%;--y:38%;--s:1.5px;--d:8.8s;--delay:-1.7s"></i>
      <i style="--x:36%;--y:60%;--s:2px;--d:9.6s;--delay:-5.3s"></i>
      <i style="--x:43%;--y:46%;--s:1.5px;--d:11s;--delay:-8.1s"></i>
      <i style="--x:48%;--y:76%;--s:2px;--d:8.5s;--delay:-4.4s"></i>
      <i style="--x:58%;--y:54%;--s:1.5px;--d:10.5s;--delay:-6.9s"></i>
      <i style="--x:69%;--y:70%;--s:2px;--d:9.2s;--delay:-2.9s"></i>
    </div>

    <section class="narration" aria-label="织梦巷旁白">
      <article class="story-row row-1" style="--delay:0.90s">
        <span class="guide" aria-hidden="true"><span class="guide-line"></span><span class="guide-diamond"></span></span>
        <p class="story-text">巴扎深处，有一条曾经最鲜艳的巷子。</p>
      </article>

      <article class="story-row row-2" style="--delay:2.35s">
        <span class="guide" aria-hidden="true"><span class="guide-line"></span><span class="guide-diamond"></span></span>
        <p class="story-text">人们叫它——<strong class="chapter-name">织梦巷。</strong></p>
      </article>

      <article class="story-row row-3" style="--delay:3.90s">
        <span class="guide" aria-hidden="true"><span class="guide-line"></span><span class="guide-diamond"></span></span>
        <p class="story-text">可不知从什么时候开始，颜色一点一点离开了这里。</p>
      </article>

      <article class="story-row row-4" style="--delay:5.75s">
        <span class="guide" aria-hidden="true"><span class="guide-line"></span><span class="guide-diamond"></span></span>
        <p class="story-text">染缸沉寂，旧布上的纹样，也渐渐模糊。</p>
      </article>

      <article class="story-row row-5" style="--delay:7.55s">
        <span class="guide" aria-hidden="true"><span class="guide-line"></span><span class="guide-diamond"></span></span>
        <p class="story-text ending">去看看吧，找回它失落的颜色。</p>
      </article>
    </section>

    <div class="warm-sweep" aria-hidden="true"></div>
    <div class="handoff" aria-hidden="true"></div>
    <button class="replay" type="button" aria-label="重播转场">重播</button>
  </main>
<script src="script.js?v=3"></script>
</body>
</html>
