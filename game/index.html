<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=">
<title>时间织城 · 织梦巷与坎儿井</title>
<link rel="stylesheet" href="shared/app.css">
</head>
<body>
<main id="menu" class="menu">
  <div class="menu-inner">
    <p class="eyebrow">一座城，两段相连的故事</p><h1>时间织城</h1>
    <p class="intro">循着巷中的纹样，走向地下的水脉。<br>用双手，接续这座城的记忆。</p>
    <div class="journey-status"><span id="journeyStatus">从织梦巷开始你的旅程</span><button id="continueJourney" class="primary" hidden>继续旅程 <span aria-hidden="true">→</span></button></div>
    <div class="chapters">
      <article class="chapter-card">
        <img class="chapter-art" src="levels/weave-lane/assets/scenes/02_weave_dream_lane/lane_market_bg.png" alt="蓝色门窗与织物环绕的织梦巷">
        <div class="chapter-copy"><p class="eyebrow">第一关 · 纹脉</p><h2>织梦巷</h2><p>走进老织坊，辨纹、扎线、染绸，找回一段古老的记忆。</p><button id="enterWeave" class="primary">走进织梦巷 →</button><span id="weaveStatus" class="chapter-status">旅程起点</span></div>
      </article>
      <article class="chapter-card">
        <img class="chapter-art karez-art" src="map-assets/SCN_L2_S.png" alt="荒漠中的坎儿井与守井人的棚屋">
        <div class="chapter-copy"><p class="eyebrow">第二关 · 水脉</p><h2>坎儿井</h2><p>制作绳梯与陶灯，深入暗渠清淤、修补，让水流重新回到小镇。</p><button id="enterKarez" class="primary" disabled>完成第一关后开启</button><span id="karezStatus" class="chapter-status">承接织梦巷的故事</span></div>
      </article>
    </div>
    <p class="menu-note">进度保存在当前浏览器 · 再次进入坎儿井会从头开始 · 两关沿用同一位主角</p>
    <p id="storageWarning" role="status" hidden>浏览器暂时无法写入存档。当前窗口仍会保留进度，请暂时不要关闭或刷新页面。</p>
  </div>
</main>
<section id="play" class="play" hidden aria-label="游戏">
  <header class="game-bar"><button id="backToMenu">‹ 关卡目录</button><span id="chapterTitle"></span><span class="bar-end"><span id="heroName"></span><button id="nextChapter" hidden>前往坎儿井 →</button></span></header>
  <div id="chapterMount" class="chapter-mount"></div><p id="loading" class="loading" role="status" hidden>正在进入关卡……</p>
</section>
<dialog id="completion" aria-labelledby="completionTitle">
  <p class="eyebrow" id="completionKicker"></p><h2 id="completionTitle"></h2><p id="completionCopy"></p>
  <div class="completion-actions"><button id="stayInChapter">继续探索</button><button id="completionNext" class="primary"></button></div>
</dialog>
<script src="shared/characters.js"></script><script src="shared/campaign.js"></script><script src="shared/app.js?v=5"></script>
</body>
</html>
