<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=">
  <title>时间织城 · 当前 UI 素材</title>
  <style>
    body { background: #142d31; color: #f5e8cc; font: 16px/1.8 "Microsoft YaHei",sans-serif; margin: 0; padding: 40px 5vw; }
    main { max-width: 1250px; margin: auto; }
    h1 { color: #e7be70; }
    p { max-width: 980px; }
    article { background: #f6e9cd; color: #49331f; border: 1px solid #b28b4a; border-radius: 12px; margin: 28px 0; padding: 24px; display: grid; grid-template-columns: 40% 1fr; gap: 28px; }
    img { width: 100%; height: 220px; object-fit: contain; background: #fff; border-radius: 6px; }
    h2 { margin: 0; font-size: 23px; }
    small { word-break: break-all; color: #775b3b; }
    a { color: #206d70; }
    main > p a { color: #e7be70; }
    @media (max-width: 700px) { article { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>时间织城 · 当前 UI 素材</h1>
    <p>当前游戏使用的 UI 源图与透明素材。砂岩、羊皮纸、孔雀青和旧金构成统一风格；文字、状态和按钮交互由游戏绘制。</p>
    <p>横条采用九宫格，方框采用五段切片，大面板保持比例。原始设计图位于 UIdesign，运行图片位于 map-assets/UI_RUNTIME。<a href="processing.json">查看处理参数</a> · <a href="../">打开游戏</a></p>
    <p id="status" role="status">正在加载素材目录…</p>
    <section id="catalog" aria-label="当前 UI 素材列表"></section>
  </main>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        const response = await fetch('processing.json');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const { assets } = await response.json();
        const catalog = document.getElementById('catalog');
        for (const item of assets) {
          const article = document.createElement('article');
          const source = document.createElement('a');
          source.href = item.source;
          const image = document.createElement('img');
          image.src = item.source;
          image.alt = item.name;
          source.append(image);
          const detail = document.createElement('div');
          const title = document.createElement('h2');
          title.textContent = item.name;
          const filename = document.createElement('small');
          filename.textContent = item.source;
          const usage = document.createElement('p');
          usage.textContent = item.usage;
          const asset = document.createElement('a');
          asset.href = item.asset;
          asset.textContent = '查看透明素材';
          detail.append(title, filename, usage, asset);
          article.append(source, detail);
          catalog.append(article);
        }
        status.textContent = '共 ' + assets.length + ' 项当前使用素材';
      } catch (error) {
        status.textContent = '目录加载失败，请通过本地游戏服务打开此页。' + error.message;
      }
    })();
  </script>
</body>
</html>
